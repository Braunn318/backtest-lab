<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Backtest Lab</title>
<style>
/* Motiv převzatý z Futures Journal PRO (app/index.html), ať je prostředí
   známé. Zelená/červená jsou vyhrazené pro PROŠLO/SELHALO, žlutá pro
   varování. */
:root{
  --bg-start:#07070a;--bg-end:#0c0d11;
  --sidebar-bg:#08090c;
  --panel:#0e1013;--panel2:#15171b;--input-bg:#0a0b0e;
  --card-bg-rgb:14,16,19;--card-bg-alpha:.96;
  --text:#eef1f6;--text2:#b9c0cc;--muted:#767d8a;
  --green:#2ecc71;--green-rgb:46,204,113;
  --red:#ff5c67;--red-rgb:255,92,103;
  --blue:#5ba7ff;--blue-rgb:91,167,255;
  --yellow:#f6c453;--yellow-rgb:246,196,83;
  --orange:#f6a623;--orange-rgb:246,166,35;
  --line:#212327;
  --tint-rgb:255,255,255;
  --shadow-rgb:0,0,0;
  --hover-border:#34507d;
  --btn-text:#ffffff;
  --btn-primary-text:#06101f;
}
html[data-theme="light"]{
  --bg-start:#eef2fb;--bg-end:#dfe7f7;
  --sidebar-bg:#ffffff;
  --panel:#ffffff;--panel2:#eef2fb;--input-bg:#ffffff;
  --card-bg-rgb:255,255,255;--card-bg-alpha:.96;
  --text:#101830;--text2:#38425e;--muted:#5b6a8e;
  --green:#1f9d57;--green-rgb:31,157,87;
  --red:#e2434f;--red-rgb:226,67,79;
  --blue:#2f6fe0;--blue-rgb:47,111,224;
  --yellow:#b8790a;--yellow-rgb:184,121,10;
  --orange:#c67200;--orange-rgb:198,114,0;
  --line:#d7deef;
  --tint-rgb:16,24,48;
  --shadow-rgb:60,72,110;
  --hover-border:#a9b8dd;
  --btn-text:#101830;
  --btn-primary-text:#ffffff;
}
:root{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
input[type="date"]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.85}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,var(--bg-start),var(--bg-end));color:var(--text);min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--sidebar-bg);border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden}
.brand{font-size:21px;font-weight:800;margin-bottom:4px}.brand span{color:var(--blue)}
.brand-sub{color:var(--muted);font-size:12px;margin-bottom:20px}
.side-group{margin-bottom:16px}
.side-group>label,.side-label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.side-group select,.side-group input[type="date"]{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 9px;border-radius:9px}
.date-row{display:grid;grid-template-columns:34px 1fr;gap:6px 8px;align-items:center}
.date-row span{color:var(--muted);font-size:12px}
.side-group input,.side-group select{min-width:0}
.toggle{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text2);cursor:pointer;margin:6px 0;line-height:1.35}
.toggle input{margin-top:2px}
.toggle.disabled{opacity:.55;cursor:default}
.hint{color:var(--muted);font-size:11.5px;line-height:1.4;margin-top:4px}
.btn{border:1px solid var(--line);border-radius:9px;padding:7px 11px;background:var(--panel2);color:var(--btn-text);font-size:12.5px}
.btn:hover{border-color:var(--hover-border)}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.path{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--text2);word-break:break-all;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.main{padding:26px;min-width:0;max-width:1400px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
h1{font-size:28px;margin:0}
.sub{color:var(--muted);margin-top:5px;font-size:13px}
h2{font-size:15px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
h2 .letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:rgba(var(--blue-rgb),.15);color:var(--blue);font-size:13px}
.section-sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.card{background:rgba(var(--card-bg-rgb),var(--card-bg-alpha));border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 12px 30px rgba(var(--shadow-rgb),.18);margin-bottom:18px;min-width:0}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.metric{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.metric .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.metric .value{font-size:24px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.metric .note{color:var(--muted);font-size:11px;margin-top:2px}
.table-scroll{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hl td{background:rgba(var(--blue-rgb),.07)}
tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.bar{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;border-radius:5px;background:var(--blue)}
.bar i.low{background:var(--red)}.bar i.mid{background:var(--yellow)}.bar i.full{background:var(--green)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-weight:800;font-size:11.5px;white-space:nowrap}
.pill.pass{background:rgba(var(--green-rgb),.15);color:var(--green)}
.pill.fail{background:rgba(var(--red-rgb),.15);color:var(--red)}
.pill.warn{background:rgba(var(--yellow-rgb),.18);color:var(--yellow)}
.pill.na{background:rgba(var(--tint-rgb),.07);color:var(--muted)}
.pill.side.long{background:rgba(var(--blue-rgb),.15);color:var(--blue)}
.pill.side.short{background:rgba(var(--yellow-rgb),.18);color:var(--yellow)}
.pill.tag{background:rgba(var(--blue-rgb),.15);color:var(--blue);font-size:10px;padding:1px 7px}
.note-row td{color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding-top:0}
.hero{border-width:1.5px}
.hero.warn{border-color:rgba(var(--yellow-rgb),.65);background:linear-gradient(0deg,rgba(var(--yellow-rgb),.06),rgba(var(--yellow-rgb),.06)),var(--panel)}
.hero.pass{border-color:rgba(var(--green-rgb),.5)}
.hero-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero-title{font-weight:800;font-size:16px}
.hero-kicker{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.hero-message{margin:10px 0 0;font-size:14px;line-height:1.5;color:var(--text)}
.hero-stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;color:var(--text2);font-size:13px}
.hero-stats b{color:var(--text);font-variant-numeric:tabular-nums}
details.check{border-bottom:1px solid var(--line)}
details.check>summary{list-style:none;display:grid;grid-template-columns:34px 92px 1fr auto;gap:10px;align-items:center;padding:10px 4px;cursor:pointer}
details.check>summary::-webkit-details-marker{display:none}
details.check>summary:hover{background:rgba(var(--tint-rgb),.03)}
details.check .cid{color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
details.check .ctitle{font-weight:600;font-size:13.5px}
details.check .csum{color:var(--muted);font-size:12.5px;text-align:right}
details.check .cbody{padding:0 4px 14px 46px}
details.check .cmsg{font-size:13px;line-height:1.45;margin:0 0 8px;color:var(--text)}
details.check.nolist>summary{cursor:default}
.items td{font-size:12.5px;padding:6px 8px}
.muted{color:var(--muted)}
.forecast{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.empty-state{padding:40px 20px;text-align:center;color:var(--muted)}
.error{background:rgba(var(--red-rgb),.12);color:var(--red);border-radius:10px;padding:11px 13px;margin-bottom:14px;font-size:13px}
.two-col{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media(max-width:1100px){.two-col{grid-template-columns:1fr}}
.two-col.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media(max-width:1100px){.two-col.even{grid-template-columns:1fr}}
/* Navigace mezi obrazovkami – jako v deníku. */
.nav{margin:0 0 18px}
.nav button{width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;margin:2px 0;font-size:14px}
.nav button .q{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text);font-weight:700}
.side-group input[type="number"]{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 9px;border-radius:9px}
/* Hlavička rozsahu: který deník, kolik záznamů, jaký rozsah dat. */
.scope{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline;background:rgba(var(--blue-rgb),.07);border:1px solid rgba(var(--blue-rgb),.35);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:13.5px}
.scope-label{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
.scope-updated{margin-left:auto;font-size:12px;align-self:center}
.lacks{color:var(--orange);font-size:11.5px;margin-top:2px}
.metric.wide{grid-column:span 2}
.metric.wide .value{font-size:18px}
.card.slim{padding:12px 16px}
.warn-card{border-color:rgba(var(--yellow-rgb),.55)}
.statement{font-size:15px;margin:4px 0 12px}
.sample{font-size:12px;font-weight:700;white-space:nowrap}
.sample.ok{color:var(--muted)}.sample.warn{color:var(--yellow)}.sample.bad{color:var(--red)}
tr.grey td{opacity:.55}
.obs-warning{background:rgba(var(--yellow-rgb),.10);border:1px solid rgba(var(--yellow-rgb),.45);color:var(--text);border-radius:10px;padding:9px 12px;margin:0 0 12px;font-size:12.5px;line-height:1.45}
td.above{color:var(--yellow);font-weight:800}
.tier{display:inline-block;margin-left:4px;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.derived{color:var(--muted);font-style:italic;text-decoration:line-through;text-decoration-color:rgba(var(--tint-rgb),.25)}
.trade-table td{font-size:12.5px;padding:7px 8px}
.trade-table td.verdict{min-width:280px;line-height:1.4;border-left:3px solid transparent}
.verdict.v-wide{border-left-color:var(--blue)}.verdict.v-tight{border-left-color:var(--yellow)}.verdict.v-short{border-left-color:var(--red)}
.verdict.v-entry{border-left-color:var(--orange)}.verdict.v-close{border-left-color:var(--green)}.verdict.v-unknown{border-left-color:var(--line);color:var(--muted)}
.histogram{display:grid;gap:4px}
.hbar{display:grid;grid-template-columns:70px 1fr 30px;gap:8px;align-items:center;font-size:11.5px}
.hlabel{color:var(--muted);text-align:right}.hval{font-weight:700}
.htrack{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}.htrack i{display:block;height:100%;background:var(--blue);border-radius:5px}
.grid-table{width:auto}
.grid-table th,.grid-table td{padding:7px 9px;font-size:12.5px;text-align:center}
.grid-table td.cell{border:1px solid var(--line);font-weight:700;min-width:58px}
.grid-table td.stable{box-shadow:inset 0 0 0 2px rgba(var(--blue-rgb),.55)}
.grid-table td.center{box-shadow:inset 0 0 0 3px var(--blue)}
.grid-table td.peak::after{content:' ★';color:var(--yellow)}
@media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Backtest <span>Lab</span></div>
    <div class="brand-sub">Čte deník, nic nezapisuje</div>

    <nav class="nav" id="nav">
      <button type="button" data-screen="health">Zdraví dat<span class="q">Sbírám použitelná data?</span></button>
      <button type="button" data-screen="sltp">SL a TP<span class="q">Zadávám je správně?</span></button>
      <button type="button" data-screen="levels">Síla hladin<span class="q">Drží hladiny proti TP a SL?</span></button>
      <button type="button" data-screen="risk">Denní risk<span class="q">Pomáhá denní stop?</span></button>
    </nav>

    <div class="side-group">
      <label for="journalSelect">Deník</label>
      <select id="journalSelect"></select>
      <label class="toggle"><input type="checkbox" id="showOutsideIndex"> Ukázat soubory mimo index</label>
    </div>

    <div class="side-group">
      <span class="side-label">Rozsah dat</span>
      <div class="date-row">
        <span>Od</span><input type="date" id="dateFrom" aria-label="Od">
        <span>Do</span><input type="date" id="dateTo" aria-label="Do">
      </div>
      <div class="btn-row"><button class="btn" id="dateReset" type="button">Celé období</button></div>
    </div>

    <div class="side-group">
      <label for="instrumentSelect">Instrument</label>
      <select id="instrumentSelect"></select>
    </div>

    <div class="side-group">
      <label for="setupSelect">Setup</label>
      <select id="setupSelect"></select>
    </div>

    <div class="side-group">
      <label class="toggle" id="skipLiveToggle"><input type="checkbox" id="includeSkipLive"> <span>Včetně obchodů, které bych naživo nevzal</span></label>
      <div class="hint" id="skipLiveHint"></div>
    </div>

    <div class="side-group" id="settingTargetR">
      <label for="sweepTargetR">Cíl pro SL sweep (R)</label>
      <input type="number" id="sweepTargetR" min="0.25" max="10" step="0.25">
      <div class="hint">Kolik zachráněných stopek by došlo na tenhle cíl vůči novému SL.</div>
    </div>

    <div class="side-group" id="settingTolerance">
      <label for="levelTolerance">Tolerance „zastavila“ (ticky)</label>
      <input type="number" id="levelTolerance" min="0" max="20" step="1">
      <div class="hint">Excursion do ± tolika ticků od hladiny = cena se o ni opřela.</div>
    </div>

    <div class="side-group">
      <span class="side-label">Zdroj dat (jen čtení)</span>
      <div class="path" id="sourcePath">…</div>
      <div class="hint" id="sourceOrigin"></div>
      <div class="btn-row">
        <button class="btn" id="sourceChoose" type="button">Změnit…</button>
        <button class="btn" id="sourceDefault" type="button">Výchozí</button>
      </div>
    </div>

    <div class="side-group">
      <button class="btn" id="themeToggle" type="button">Světlý / tmavý motiv</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="screenTitle">Zdraví dat</h1>
        <div class="sub" id="screenQuestion">Sbírám použitelná data?</div>
      </div>
      <button class="btn" id="reload" type="button">Načíst znovu</button>
    </div>
    <div id="content"><div class="empty-state">Načítám…</div></div>
  </main>
</div>
<script src="labels.js"></script>
<script src="normalize.js"></script>
<script src="health.js"></script>
<script src="sltp.js"></script>
<script src="strength.js"></script>
<script src="sequence.js"></script>
<script src="ui-common.js"></script>
<script src="ui-health.js"></script>
<script src="ui-sltp.js"></script>
<script src="ui-levels.js"></script>
<script src="ui-risk.js"></script>
<script src="ui.js"></script>
</body>
</html>
